name: XAUUSD Research Competition

on:
  workflow_dispatch:

jobs:
  competition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run multi-candidate research
        run: python research/competition.py
      - name: Upload competition results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-competition-results
          path: |
            competition.json
            competition.csv
            xauusd_lab.sqlite
          if-no-files-found: warn
