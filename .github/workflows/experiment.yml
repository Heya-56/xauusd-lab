name: XAUUSD Research Competition

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/experiment.yml"
      - "config/**"
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1,3,5"

jobs:
  competition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run multi-candidate research
        run: python research/competition.py
      - name: Upload competition results
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-competition-results
          path: |
            competition.json
            competition.csv
            xauusd_lab.sqlite
