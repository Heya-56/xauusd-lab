name: XAUUSD Research Experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1,3,5"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m src.main
