name: XAUUSD Research Experiment

on:
  push:
    paths:
      - "research/**"
      - ".github/workflows/experiment.yml"
      - "config/**"
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1,3,5"

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run first reproducible candidate backtest
        run: python research/run_lab.py
      - name: Upload lab results
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-lab-results
          path: |
            lab_result.json
            lab_trades.csv
