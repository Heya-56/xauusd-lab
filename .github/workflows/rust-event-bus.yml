name: Rust event bus

on:
  pull_request:
    paths:
      - "services/rust-event-bus/**"
      - ".github/workflows/rust-event-bus.yml"
  push:
    branches:
      - "feature/rust-tick-event-bus"
    paths:
      - "services/rust-event-bus/**"
      - ".github/workflows/rust-event-bus.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-event-bus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust-event-bus
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
