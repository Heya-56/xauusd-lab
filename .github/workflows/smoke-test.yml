name: Lab smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "research/**"
      - "requirements.txt"
      - "web/**"
      - "migrations/**"
      - "reports/baseline/**"
      - "workers/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile research/ibkr_spot_backtest.py
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker tests + integration with the real Python engine (no network)
        run: node --no-warnings --test workers/accounts-api/test/*.test.js
