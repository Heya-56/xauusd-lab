name: Lab smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "research/**"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile research/ibkr_spot_backtest.py
      - run: pytest -q
