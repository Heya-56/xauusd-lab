name: Lab smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "research/**"
      - "requirements.txt"
      - "web/**"
      - "migrations/**"
      - "reports/baseline/**"
      - "workers/**"

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research script
        run: python -m py_compile research/ibkr_spot_backtest.py
      - name: Run Python tests
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker tests + integration with the real Python engine (no network)
        run: node --no-warnings --test workers/accounts-api/test/*.test.js

      # Always create a readable summary, including when an earlier step fails.
      - name: Create diagnostic report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ci-report
          {
            echo "# XAUUSD Lab — CI diagnostic report"
            echo
            echo "- **Status:** ${JOB_STATUS}"
            echo "- **Repository:** ${REPOSITORY}"
            echo "- **Branch:** ${BRANCH_NAME}"
            echo "- **Commit:** ${COMMIT_SHA}"
            echo "- **Run:** [${RUN_ID} / attempt ${RUN_ATTEMPT}](${RUN_URL})"
            echo "- **Generated (UTC):** $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Step outcomes"
            echo "The GitHub Actions run page contains the detailed command output and traceback."
          } > ci-report/diagnostic-report.md
          cat ci-report/diagnostic-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-lab-ci-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-report/diagnostic-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Open GitHub bug report when CI fails
        if: failure()
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const title = `CI failure: Lab smoke test — ${process.env.BRANCH_NAME} — run ${process.env.RUN_ID}`;
            const body = [
              "## Automatic CI failure report",
              "",
              "The XAUUSD Lab smoke test failed. This issue was generated by GitHub Actions.",
              "",
              `- **Branch:** ${process.env.BRANCH_NAME}`,
              `- **Commit:** ${process.env.COMMIT_SHA}`,
              `- **Run:** [Open full logs](${process.env.RUN_URL})`,
              `- **Attempt:** ${process.env.RUN_ATTEMPT}`,
              "",
              "### Next steps",
              "1. Open the workflow logs and identify the first failing step.",
              "2. Reproduce and fix the failure on a feature branch.",
              "3. Add or update a regression test before closing this issue.",
              "",
              "> No trading orders were placed by this CI workflow. This report concerns software checks only."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const duplicate = existing.data.find(issue =>
              !issue.pull_request && issue.title === title
            );
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Another attempt failed. [Run ${process.env.RUN_ID}](${process.env.RUN_URL})`
              });
              core.info(`Updated existing failure issue #${duplicate.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              core.info(`Created failure issue #${issue.data.number}`);
            }
