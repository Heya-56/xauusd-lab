name: Deploy preview (manual)

# Manual only. Nothing deploys on push. Requires repository secrets/variables:
#   secrets: CLOUDFLARE_API_TOKEN (scope: Workers Scripts Edit, D1 Edit, Pages Edit — one account),
#            ENGINE_SECRET, TURNSTILE_SECRET, RESEND_API_KEY
#   vars:    CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID, PAGES_PROJECT, DASHBOARD_ORIGIN, ENGINE_URL,
#            EMAIL_FROM, TURNSTILE_SITEKEY, ACCOUNTS_API_URL
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-preview" to confirm'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy-preview'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m pip install -r requirements.txt
      - name: Tests must pass before any deploy
        run: |
          pytest -q
          node --no-warnings --test workers/accounts-api/test/*.test.js
      - name: Render wrangler.toml for preview
        working-directory: workers/accounts-api
        run: |
          sed -e "s#<set-outside-git>#${{ vars.D1_DATABASE_ID }}#" \
              -e "s#https://<your-dashboard>.pages.dev#${{ vars.DASHBOARD_ORIGIN }}#g" \
              -e "s#https://<engine-host>#${{ vars.ENGINE_URL }}#" \
              -e "s#Hinova Trading Lab <no-reply@<your-domain>>#${{ vars.EMAIL_FROM }}#" \
              wrangler.example.toml > wrangler.toml
          grep -q "<" wrangler.toml && { echo "unrendered placeholder"; exit 1; } || true
      - name: D1 migrations, Worker and secrets
        working-directory: workers/accounts-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ENGINE_SECRET: ${{ secrets.ENGINE_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npm ci
          npx wrangler d1 migrations apply hinova-trading-lab --remote
          npx wrangler deploy
          printf '%s' "$ENGINE_SECRET"    | npx wrangler secret put ENGINE_SECRET
          printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET
          printf '%s' "$RESEND_API_KEY"   | npx wrangler secret put RESEND_API_KEY
      - name: Dashboard on Pages (preview branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > web/config.js <<JS
          window.HINOVA_ACCOUNTS_API = "${{ vars.ACCOUNTS_API_URL }}";
          window.HINOVA_TURNSTILE_SITEKEY = "${{ vars.TURNSTILE_SITEKEY }}";
          JS
          npx --yes wrangler@4.151.0 pages deploy web --project-name "${{ vars.PAGES_PROJECT }}" --branch preview
