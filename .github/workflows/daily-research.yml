name: Daily research

on:
  schedule:
    - cron: "17 16 * * 1-5"   # 16:17 UTC (06:17 Tahiti), weekdays
  workflow_dispatch:
  push:   # until merged to main, workflow_dispatch is unavailable for this file
    branches: [feature/gold-engine-mql5-tradingagents]
    paths: ["src/**", "research/**", "config/**", ".github/workflows/daily-research.yml"]

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt

      - name: 1. Deterministic tests (no network, no API key)
        run: pytest -q

      - name: 2. Regression check on the synthetic fixture vs locked baseline
        run: >
          python research/daily_research.py --mode fixture
          --out reports/out/fixture
          --baseline reports/baseline/fixture_baseline.json
          --fail-on-regression

      - name: 3a. Fetch XAUUSD M15 from Dukascopy (network job, may fail -> DATA_MISSING)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -uo pipefail
          FROM=$(date -u -d "365 days ago" +%F)
          for SIDE in bid ask; do
            if ! npx --yes dukascopy-node@1.50.0 -i xauusd -from "$FROM" -to now -t m15 -p $SIDE -v -f csv -dir raw/$SIDE > fetch_$SIDE.log 2>&1; then
              echo "::error title=fetch-$SIDE::$(tail -c 600 fetch_$SIDE.log | tr '\n' ' ')"; exit 1
            fi
            echo "::notice title=fetch-$SIDE::$(ls raw/$SIDE) $(wc -l < raw/$SIDE/*.csv) lines; head: $(head -2 raw/$SIDE/*.csv | tr '\n' ' ')"
          done
          if ! python research/import_dukascopy.py raw/bid/*.csv data/verified/xauusd_m15_dukascopy.csv \
               --timeframe M15 --side bid --ask raw/ask/*.csv --tool-version dukascopy-node@1.50.0 > import.log 2>&1; then
            echo "::error title=import::$(tail -c 600 import.log | tr '\n' ' ')"; exit 1
          fi
          echo "::notice title=import::$(cat import.log)"

      - name: 3. Research on verified data (reports DATA_MISSING if none)
        if: always()
        run: |
          python research/daily_research.py --mode real --out reports/out/real
          echo "::notice title=real-report::$(grep -E 'Status|Dataset|Data note' reports/out/real/report.md | tr '\n' ' ')"

      - name: Upload CSV / JSON / Markdown reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-${{ github.run_id }}
          path: reports/out/
          if-no-files-found: warn

      - name: Open review issue with proposals (never merges or deploys)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated research run ${{ github.run_id }} on \`${GITHUB_SHA::7}\`."
            echo
            echo "Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat reports/out/real/report.md 2>/dev/null || echo "real report missing"
            echo
            cat reports/out/real/proposals.md 2>/dev/null
            echo
            echo "_Proposals require human review. Nothing was promoted, merged or deployed._"
          } > issue.md
          gh issue create --title "Daily research $(date -u +%F)" --body-file issue.md --label research \
            || gh issue create --title "Daily research $(date -u +%F)" --body-file issue.md
